# ============================================================
# 2026-04-13 — LogReg on CIFAR-10, σ=3.0, extended to 25 epochs
# to cross ε_PLD ≈ 8-9
# ============================================================
_base_: ../default.yaml

dataset:
  name: cifar10
  val_fraction: 0.0
  subset_n: 1000

model:
  arch: logreg

training:
  epochs: 25
  batch_size: 500
  learning_rate: 0.5
  max_grad_norm: 1.0
  noise_multiplier: 3.0
  delta: 1.0e-5
  max_physical_batch_size: 500
  optimizer: sgd_no_momentum
  eval_every_n_epochs: 1
  accounting_methods: [rdp, zcdp, pld]

auditing:
  one_run:
    num_canaries: 0
    mislabel: true
    include_base: false
    abstention_threshold: 0.0
    confidence_beta: 0.05

evaluation:
  output_dir: results/experiments/2026-04-13_eps8_logreg_25ep
