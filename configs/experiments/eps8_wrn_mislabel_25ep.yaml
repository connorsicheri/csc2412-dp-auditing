# ============================================================
# 2026-04-13 — WRN on CIFAR-10, σ=3.0, MISLABELED, 25 epochs
# Control experiment: same setup as LogReg/MLP but with WRN.
# Expected: zero audit signal (model too large, noise drowns signal)
# ============================================================
_base_: ../default.yaml

dataset:
  name: cifar10
  val_fraction: 0.0
  subset_n: 1000

model:
  arch: wrn
  wrn_depth: 16
  wrn_widen: 4

training:
  epochs: 25
  batch_size: 500
  learning_rate: 2.0
  max_grad_norm: 1.0
  noise_multiplier: 3.0
  delta: 1.0e-5
  max_physical_batch_size: 16
  optimizer: sgd_no_momentum
  eval_every_n_epochs: 1
  accounting_methods: [rdp, zcdp, pld]

auditing:
  one_run:
    num_canaries: 0
    mislabel: true
    include_base: false
    abstention_threshold: 0.0
    confidence_beta: 0.05

evaluation:
  output_dir: results/experiments/2026-04-13_eps8_wrn_mislabel_25ep
