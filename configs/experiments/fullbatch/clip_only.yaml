# ============================================================
# 2026-03-27 — CLIPPING-ONLY BASELINE (C=1.0, σ=0)
# No Opacus, uses clip_grad_norm_ for total gradient clipping.
# Purpose: confirm memorization survives gradient clipping.
# Result: Memorizes smoothly by ~epoch 100. ε_audit peak=3.14.
# ============================================================
_base_: ../../default.yaml

dataset:
  name: cifar10
  val_fraction: 0.0
  subset_n: 1000

model:
  arch: wrn
  wrn_depth: 16
  wrn_widen: 4

training:
  disable_dp: true
  epochs: 200
  batch_size: 64
  learning_rate: 0.1         # same as non-DP baseline; LR=4.0 diverges with total norm clip
  max_grad_norm: 1.0         # gradient clipping at C=1.0
  noise_multiplier: 0.0
  delta: 1.0e-5
  max_physical_batch_size: 64
  optimizer: sgd_no_momentum
  eval_every_n_epochs: 20

auditing:
  one_run:
    num_canaries: 0
    mislabel: true
    include_base: false
    abstention_threshold: 0.0
    confidence_beta: 0.05

evaluation:
  output_dir: results/experiments/2026-03-27_clip_only_sgd
