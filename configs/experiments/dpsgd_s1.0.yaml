# ============================================================
# 2026-03-27 — DP-SGD with σ=1.0, C=1.0
# Phase 2: moderate noise level. Opacus per-sample clipping + noise.
# ============================================================
_base_: ../default.yaml

dataset:
  name: cifar10
  val_fraction: 0.0
  subset_n: 1000

model:
  arch: wrn
  wrn_depth: 16
  wrn_widen: 4

training:
  epochs: 300
  batch_size: 64
  learning_rate: 0.1
  max_grad_norm: 1.0
  noise_multiplier: 1.0
  delta: 1.0e-5
  max_physical_batch_size: 8
  optimizer: sgd_no_momentum
  eval_every_n_epochs: 20

auditing:
  one_run:
    num_canaries: 0
    mislabel: true
    include_base: false
    abstention_threshold: 0.0
    confidence_beta: 0.05

evaluation:
  output_dir: results/experiments/2026-03-27_dpsgd_s1.0
