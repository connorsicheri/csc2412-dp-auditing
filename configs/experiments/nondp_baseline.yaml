# ============================================================
# 2026-03-27 — NON-DP BASELINE
# No noise, no Opacus, mislabeled canaries.
# Purpose: Validate the audit pipeline end-to-end with zero
#          privacy. Per author's advice: "run on a non-DP model
#          to make sure things look right."
# Result: Memorizes canaries by ~epoch 90. ε_audit peak=2.72.
# ============================================================
_base_: ../default.yaml

dataset:
  name: cifar10
  val_fraction: 0.0
  subset_n: 1000        # m = n = 1000

model:
  arch: wrn
  wrn_depth: 16
  wrn_widen: 4

training:
  disable_dp: true      # ← NO OPACUS, plain PyTorch training
  epochs: 200
  batch_size: 64
  learning_rate: 0.1    # standard SGD LR (no clipping → can't use De et al.'s 4.0)
  max_grad_norm: 10000.0  # effectively no clipping
  noise_multiplier: 0.0 # ignored when disable_dp=true
  delta: 1.0e-5
  max_physical_batch_size: 64
  optimizer: sgd_no_momentum
  eval_every_n_epochs: 20

auditing:
  one_run:
    num_canaries: 0     # 0 → m = n
    mislabel: true      # mislabeled canaries (per author's advice)
    include_base: false
    abstention_threshold: 0.0
    confidence_beta: 0.05

evaluation:
  output_dir: results/experiments/2026-03-27_nondp_baseline_sgd
